name: Linux ARM64 Build & Release

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'jules/**'
      - 'dev/**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

concurrency:
  group: arm64-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-unknown-linux-gnu

      - name: Install cross-compilation toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu dpkg-dev

      - name: Build optimized release binaries for aarch64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu -p wordcraft -p wordcraft-cli

      - name: Create Debian ARM64 package
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="wordcraft") | .version')
          mkdir -p dist/release
          mkdir -p /tmp/deb-pkg/DEBIAN /tmp/deb-pkg/usr/bin /tmp/deb-pkg/usr/share/applications

          cp target/aarch64-unknown-linux-gnu/release/wordcraft /tmp/deb-pkg/usr/bin/
          cp target/aarch64-unknown-linux-gnu/release/wordcraft-cli /tmp/deb-pkg/usr/bin/
          aarch64-linux-gnu-strip /tmp/deb-pkg/usr/bin/wordcraft /tmp/deb-pkg/usr/bin/wordcraft-cli
          cp packaging/linux/ai.storyteller.wordcraft.desktop /tmp/deb-pkg/usr/share/applications/

          cat << EOF > /tmp/deb-pkg/DEBIAN/control
          Package: wordcraft
          Version: ${VERSION}
          Architecture: arm64
          Maintainer: WordCraft maintainers <wordcraft@storyteller.ai>
          Section: editors
          Priority: optional
          Description: WordCraft Desktop Processor
           Microsoft Word-compatible word processor built with Rust.
          EOF

          dpkg-deb --build /tmp/deb-pkg dist/release/wordcraft-${VERSION}-linux-arm64.deb
          tar -czf dist/release/wordcraft-${VERSION}-linux-aarch64.tar.gz -C target/aarch64-unknown-linux-gnu/release wordcraft wordcraft-cli

      - name: Upload ARM64 Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-linux-arm64
          path: dist/release/*

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
